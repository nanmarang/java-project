<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #050c12;
        --panel: rgba(15, 22, 32, 0.9);
        --line: rgba(148, 163, 184, 0.2);
        --text: #edf6ff;
        --muted: #98a9bf;
        --accent: #75f0d5;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at top, rgba(117, 240, 213, 0.16), transparent 30%),
          var(--bg);
        color: var(--text);
      }
      .card {
        width: min(92vw, 500px);
        text-align: center;
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.34);
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 20px;
        border-radius: 12px;
        text-decoration: none;
        color: #03171b;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), #7dd3fc);
      }
      .meta {
        margin-top: 22px;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Page not found</h1>
      <p>
        This page doesn’t exist.<br />
        The app may have moved or the route is invalid.
      </p>
      <a href="/">Go back home</a>
      <div class="meta">404 · not found</div>
    </main>
  </body>
</html>
